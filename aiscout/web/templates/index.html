<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Scout</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#242736;--surface3:#2d3040;--border:#2e3146;--text:#e1e4ed;--text-muted:#8b8fa3;--text-dim:#5c6078;--accent:#6366f1;--accent-bg:rgba(99,102,241,0.12);--ok:#22c55e;--warning:#f59e0b;--critical:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{width:100%;padding:1.5rem 2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem}
.header h1{font-size:1.2rem;font-weight:700}.header h1 span{color:var(--accent)}
.header .ver{font-size:.7rem;color:var(--text-dim)}

.main{width:100%;max-width:700px;padding:2rem}

/* Steps indicator */
.steps{display:flex;gap:0;margin-bottom:2rem}
.step-ind{flex:1;text-align:center;padding:.6rem;font-size:.8rem;color:var(--text-dim);border-bottom:2px solid var(--border);cursor:pointer;transition:all .15s}
.step-ind.active{color:var(--accent);border-bottom-color:var(--accent)}
.step-ind.done{color:var(--ok);border-bottom-color:var(--ok)}
.step-num{font-weight:700;margin-right:.3rem}

/* Panels */
.panel{display:none}.panel.active{display:block}

/* Form elements */
.field{margin-bottom:1rem}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.03em}
input[type=text],input[type=password],select{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.5rem .7rem;border-radius:6px;font-size:.85rem;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--text-dim)}

/* Repo list */
.repo-list{display:flex;flex-direction:column;gap:.5rem}
.repo-row{display:flex;gap:.5rem;align-items:center}
.repo-row input{flex:1}
.repo-row .btn-sm{padding:.5rem .7rem;font-size:.8rem}

/* LLM mode cards */
.llm-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.llm-mode{background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:1rem;cursor:pointer;text-align:center;transition:all .15s}
.llm-mode:hover{border-color:var(--text-muted)}
.llm-mode.active{border-color:var(--accent);background:var(--accent-bg)}
.llm-mode .mode-icon{font-size:1.5rem;margin-bottom:.3rem}
.llm-mode .mode-name{font-size:.85rem;font-weight:600}
.llm-mode .mode-desc{font-size:.7rem;color:var(--text-muted);margin-top:.2rem}

/* LLM config panels */
.llm-config{display:none;margin-top:1rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1rem}
.llm-config.active{display:block}

/* Buttons */
.btn{background:var(--accent);color:#fff;border:none;padding:.6rem 1.5rem;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
.btn-outline:hover{border-color:var(--accent);color:var(--text)}
.btn-sm{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);padding:.3rem .6rem;border-radius:4px;font-size:.75rem;cursor:pointer}
.btn-danger{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:.8rem;padding:.3rem}
.btn-danger:hover{color:var(--critical)}
.actions{display:flex;justify-content:space-between;margin-top:1.5rem}

/* Progress */
.progress-log{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1rem;max-height:400px;overflow-y:auto;font-family:'SF Mono','Fira Code',monospace;font-size:.78rem;line-height:1.6}
.log-line{padding:.1rem 0}.log-line.info{color:var(--text-muted)}.log-line.success{color:var(--ok)}.log-line.warning{color:var(--warning)}.log-line.error{color:var(--critical)}
.log-line::before{content:"▸ ";color:var(--text-dim)}
.log-line.success::before{content:"✓ ";color:var(--ok)}
.log-line.error::before{content:"✗ ";color:var(--critical)}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin-right:.5rem;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Report frame */
.report-frame{width:100%;border:none;min-height:80vh;border-radius:8px;background:var(--bg)}
.report-wrap{max-width:100%;width:100vw;padding:0 1rem;position:relative;left:50%;transform:translateX(-50%)}

/* Ollama model list */
.model-list{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.model-chip{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:.2rem .5rem;font-size:.75rem;cursor:pointer;transition:all .12s}
.model-chip:hover{border-color:var(--accent)}
.model-chip.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<div class="header">
  <h1><span>AI Scout</span></h1>
  <span class="ver">Web UI</span>
</div>

<div class="main" id="wizardMain">

  <!-- Steps indicator -->
  <div class="steps">
    <div class="step-ind active" data-step="1"><span class="step-num">1</span>Repositories</div>
    <div class="step-ind" data-step="2"><span class="step-num">2</span>LLM Configuration</div>
    <div class="step-ind" data-step="3"><span class="step-num">3</span>Scan</div>
  </div>

  <!-- Step 1: Repositories -->
  <div class="panel active" id="step1">
    <div class="field">
      <label>Git Repositories</label>
      <div class="repo-list" id="repoList">
        <div class="repo-row">
          <input type="text" placeholder="https://github.com/org/repo" class="repo-url">
          <input type="text" placeholder="Branch (main)" class="repo-branch" style="max-width:100px">
        </div>
      </div>
      <button class="btn-sm" style="margin-top:.5rem" onclick="addRepoRow()">+ Add repository</button>
    </div>

    <div class="field">
      <label>GitHub Token (optional, for private repos)</label>
      <input type="password" id="gitToken" placeholder="ghp_...">
    </div>

    <div class="actions">
      <div></div>
      <button class="btn" onclick="goStep(2)">Next: LLM Config →</button>
    </div>
  </div>

  <!-- Step 2: LLM Configuration -->
  <div class="panel" id="step2">
    <div class="llm-modes">
      <div class="llm-mode active" data-mode="none" onclick="selectLLM('none')">
        <div class="mode-icon">⚡</div>
        <div class="mode-name">No LLM</div>
        <div class="mode-desc">Fast rule-based analysis</div>
      </div>
      <div class="llm-mode" data-mode="ollama" onclick="selectLLM('ollama')">
        <div class="mode-icon">🏠</div>
        <div class="mode-name">Local Ollama</div>
        <div class="mode-desc">Your machine, your data</div>
      </div>
      <div class="llm-mode" data-mode="openai" onclick="selectLLM('openai')">
        <div class="mode-icon">🔑</div>
        <div class="mode-name">API Key</div>
        <div class="mode-desc">OpenAI / Azure / Anthropic</div>
      </div>
    </div>

    <!-- Ollama config -->
    <div class="llm-config" id="cfg-ollama">
      <div class="field">
        <label>Ollama URL</label>
        <input type="text" id="ollamaUrl" value="http://localhost:11434">
      </div>
      <div class="field">
        <label>Available Models</label>
        <div class="model-list" id="modelList">
          <span style="color:var(--text-dim);font-size:.75rem">Click "Detect" to find models</span>
        </div>
        <button class="btn-sm" style="margin-top:.4rem" onclick="detectModels()">Detect models</button>
      </div>
      <div class="field">
        <label>Model</label>
        <input type="text" id="ollamaModel" placeholder="qwen2.5-coder:7b">
      </div>
    </div>

    <!-- API config -->
    <div class="llm-config" id="cfg-openai">
      <div class="field">
        <label>API Endpoint</label>
        <input type="text" id="apiUrl" placeholder="https://api.openai.com">
      </div>
      <div class="field">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
      </div>
      <div class="field">
        <label>Model</label>
        <input type="text" id="apiModel" placeholder="gpt-4o-mini">
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-outline" onclick="goStep(1)">← Back</button>
      <button class="btn" onclick="goStep(3)">Start Scan →</button>
    </div>
  </div>

  <!-- Step 3: Scan Progress -->
  <div class="panel" id="step3">
    <div id="scanProgress">
      <p style="margin-bottom:1rem"><span class="spinner"></span>Scan in progress...</p>
      <div class="progress-log" id="logArea"></div>
    </div>
    <div id="scanDone" style="display:none">
      <p style="color:var(--ok);font-weight:600;margin-bottom:1rem">✓ Scan complete</p>
      <button class="btn" onclick="showReport()">View Report</button>
      <button class="btn btn-outline" style="margin-left:.5rem" onclick="goStep(1)">New Scan</button>
    </div>
    <div id="scanError" style="display:none">
      <p style="color:var(--critical);font-weight:600;margin-bottom:.5rem">✗ Scan failed</p>
      <p id="errorMsg" style="font-size:.85rem;color:var(--text-muted)"></p>
      <button class="btn btn-outline" style="margin-top:1rem" onclick="goStep(1)">Try Again</button>
    </div>
  </div>
</div>

<!-- Report view (replaces wizard) -->
<div class="report-wrap" id="reportWrap" style="display:none">
  <div style="padding:.5rem 1rem;display:flex;align-items:center;gap:1rem">
    <button class="btn btn-outline btn-sm" onclick="backToWizard()">← New Scan</button>
    <span style="font-size:.8rem;color:var(--text-muted)">AI Scout Report</span>
  </div>
  <iframe class="report-frame" id="reportFrame"></iframe>
</div>

<script>
let currentStep = 1;
let llmMode = 'none';
let currentScanId = null;

// Step navigation
function goStep(n) {
  if (n === 3) startScan();
  currentStep = n;
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');
  document.querySelectorAll('.step-ind').forEach(s => {
    const sn = parseInt(s.dataset.step);
    s.classList.toggle('active', sn === n);
    s.classList.toggle('done', sn < n);
  });
}

// Repo rows
function addRepoRow() {
  const list = document.getElementById('repoList');
  const row = document.createElement('div');
  row.className = 'repo-row';
  row.innerHTML = `
    <input type="text" placeholder="https://github.com/org/repo" class="repo-url">
    <input type="text" placeholder="Branch" class="repo-branch" style="max-width:100px">
    <button class="btn-danger" onclick="this.parentElement.remove()">✕</button>
  `;
  list.appendChild(row);
}

// LLM mode selection
function selectLLM(mode) {
  llmMode = mode;
  document.querySelectorAll('.llm-mode').forEach(m => m.classList.toggle('active', m.dataset.mode === mode));
  document.querySelectorAll('.llm-config').forEach(c => c.classList.remove('active'));
  if (mode !== 'none') {
    const cfg = document.getElementById('cfg-' + mode);
    if (cfg) cfg.classList.add('active');
  }
}

// Detect Ollama models
async function detectModels() {
  const url = document.getElementById('ollamaUrl').value;
  const list = document.getElementById('modelList');
  list.innerHTML = '<span style="color:var(--text-dim);font-size:.75rem">Detecting...</span>';
  try {
    const resp = await fetch('/api/ollama/models?url=' + encodeURIComponent(url));
    const data = await resp.json();
    if (data.models && data.models.length > 0) {
      list.innerHTML = data.models.map(m =>
        `<span class="model-chip" onclick="pickModel('${m}')">${m}</span>`
      ).join('');
    } else {
      list.innerHTML = `<span style="color:var(--critical);font-size:.75rem">No models found. ${data.detail || ''}</span>`;
    }
  } catch(e) {
    list.innerHTML = `<span style="color:var(--critical);font-size:.75rem">Connection failed</span>`;
  }
}

function pickModel(name) {
  document.getElementById('ollamaModel').value = name;
  document.querySelectorAll('.model-chip').forEach(c => c.classList.toggle('active', c.textContent === name));
}

// Build scan config
function buildConfig() {
  const repos = [];
  const token = document.getElementById('gitToken').value.trim();
  document.querySelectorAll('.repo-row').forEach(row => {
    const url = row.querySelector('.repo-url').value.trim();
    const branch = row.querySelector('.repo-branch').value.trim() || 'main';
    if (url) repos.push({ url, branch, token: token || undefined });
  });

  const llm = { mode: llmMode };
  if (llmMode === 'ollama') {
    llm.url = document.getElementById('ollamaUrl').value;
    llm.model = document.getElementById('ollamaModel').value || 'qwen2.5-coder:7b';
  } else if (llmMode === 'openai') {
    llm.url = document.getElementById('apiUrl').value;
    llm.api_key = document.getElementById('apiKey').value;
    llm.model = document.getElementById('apiModel').value || 'gpt-4o-mini';
  }

  return { repositories: repos, llm };
}

// Start scan
async function startScan() {
  const config = buildConfig();
  if (!config.repositories.length) {
    alert('Please add at least one repository');
    return goStep(1);
  }

  // Reset UI
  document.getElementById('logArea').innerHTML = '';
  document.getElementById('scanProgress').style.display = 'block';
  document.getElementById('scanDone').style.display = 'none';
  document.getElementById('scanError').style.display = 'none';

  try {
    const resp = await fetch('/api/scan', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(config),
    });
    const data = await resp.json();
    currentScanId = data.scan_id;

    // Listen for progress
    const es = new EventSource('/api/scan/' + currentScanId + '/progress');
    const log = document.getElementById('logArea');

    es.addEventListener('progress', e => {
      const msg = JSON.parse(e.data);
      const div = document.createElement('div');
      div.className = 'log-line ' + (msg.level || 'info');
      div.textContent = msg.message;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    });

    es.addEventListener('done', () => {
      es.close();
      document.getElementById('scanProgress').style.display = 'none';
      document.getElementById('scanDone').style.display = 'block';
    });

    es.addEventListener('error', e => {
      es.close();
      let msg = 'Unknown error';
      try { msg = JSON.parse(e.data).message; } catch(ex) {}
      document.getElementById('scanProgress').style.display = 'none';
      document.getElementById('scanError').style.display = 'block';
      document.getElementById('errorMsg').textContent = msg;
    });

  } catch(e) {
    document.getElementById('scanProgress').style.display = 'none';
    document.getElementById('scanError').style.display = 'block';
    document.getElementById('errorMsg').textContent = e.message;
  }
}

// Show report
function showReport() {
  document.getElementById('wizardMain').style.display = 'none';
  const wrap = document.getElementById('reportWrap');
  wrap.style.display = 'block';
  document.getElementById('reportFrame').src = '/api/scan/' + currentScanId + '/report';
}

function backToWizard() {
  document.getElementById('reportWrap').style.display = 'none';
  document.getElementById('wizardMain').style.display = 'block';
  goStep(1);
}

// Step indicators clickable
document.querySelectorAll('.step-ind').forEach(s => {
  s.addEventListener('click', () => {
    const n = parseInt(s.dataset.step);
    if (n < 3) goStep(n);
  });
});
</script>
</body>
</html>
